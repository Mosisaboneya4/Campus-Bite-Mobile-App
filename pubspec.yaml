name: campusbite
description: A Flutter application for tracking campus meal contracts and balances
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Charts
  fl_chart: ^1.2.0
  
  # Date & Time
  intl: ^0.20.3
  table_calendar: ^3.0.9
  
  # Export functionality
  pdf: ^3.10.7
  csv: ^8.0.0
  share_plus: ^13.3.0
  # path_provider removed for CI compatibility
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_slidable: ^4.0.3
  
  # Utilities
  uuid: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
